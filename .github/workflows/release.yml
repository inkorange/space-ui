name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens/updates the "Version Packages" PR.
      # When that PR merges: builds and publishes to npm with provenance.
      # GATED on NPM_TOKEN being configured: without the gate, a main push
      # with zero pending changesets makes the action attempt a direct npm
      # publish of whatever version sits in package.json (it tried 0.0.0 on
      # the very first push). Until the token exists, this workflow is a
      # deliberate no-op.
      - if: ${{ secrets.NPM_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
