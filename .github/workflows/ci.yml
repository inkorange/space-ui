name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required by the changeset check below. actions/checkout
      # defaults to a depth-1 shallow clone, which leaves no origin/main ref and
      # no shared history, so `--since=origin/main` cannot find where HEAD
      # diverged and fails every PR regardless of its contents.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inkorange/space-ui typecheck
      # The gallery is type-checked too: it consumes the library's public API,
      # so a story calling a prop that does not exist is a real API regression
      # and used to pass CI silently.
      - run: pnpm --filter docs typecheck
      - run: pnpm --filter @inkorange/space-ui test
      - run: pnpm --filter @inkorange/space-ui build
      - run: pnpm --filter docs build
      # Library-source PRs must carry a changeset (docs-only changes pass).
      # Skipped on the release branch: a "Version Packages" PR bumps
      # package.json and DELETES every changeset, so this guard is guaranteed
      # to fail on the one PR that must never carry one.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since=origin/main
